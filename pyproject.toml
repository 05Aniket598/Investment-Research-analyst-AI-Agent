[project]
name = "investment_analyst_agent"
version = "0.1.0"
description = "Investment_Analyst_Agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "crewai[google-genai,tools]",
    "google>=3.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pymupdf>=1.26.7",
    "pypdf>=7.0.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
investment_analyst_agent = "investment_analyst_agent.main:run"
run_crew = "investment_analyst_agent.main:run"
train = "investment_analyst_agent.main:train"
replay = "investment_analyst_agent.main:replay"
test = "investment_analyst_agent.main:test"
run_with_trigger = "investment_analyst_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "2c89ca45-b228-41b6-b28b-257fbb130de8"
